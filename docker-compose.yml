services:
  api:
    build: .
    expose:
      - "8080"
    environment:
      - PORT=8080
      - ENABLE_BLUEPRINTS_FILE=.enable_blueprints
      - DATABASE_URL=sqlite:///structured_docs.db
      # Email settings (override via .env or environment in production)
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.protonmail.ch}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@structureddocs.online}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - FROM_NAME=${FROM_NAME:-StructuredDocs}
      - FRONTEND_URL=${FRONTEND_URL:-https://structureddocs.online}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    volumes:
      - .:/app
    command: ["./start.sh"]

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # stores SSL certs (must persist across restarts)
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
