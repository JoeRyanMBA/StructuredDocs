version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-structureddocs-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - backend/.env.example # Replace with real .env in production
    environment:
      PORT: 8080
      RUN_DB_MIGRATIONS: "1"
    ports:
      - "8080:8080"
    mem_limit: ${APP_MEM_LIMIT:-1g}
    cpus: ${APP_CPU_LIMIT:-1.0}
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
