version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: structureddocs-backend:latest
    restart: unless-stopped
    env_file:
      - backend/.env.example # Replace with real .env in production
    environment:
      PORT: 8080
      RUN_DB_MIGRATIONS: "1"
    ports:
      - "8080:8080"
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
