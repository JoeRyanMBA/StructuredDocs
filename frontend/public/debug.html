<!DOCTYPE html>
<html>
<head>
    <title>Debug Topics Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>Topics Page Debug</h1>
    
    <div class="debug">
        <h3>Authentication Status:</h3>
        <p id="auth-status">Checking...</p>
    </div>
    
    <div class="debug">
        <h3>Current URL:</h3>
        <p id="current-url">Loading...</p>
    </div>
    
    <div class="debug">
        <h3>Console Errors:</h3>
        <div id="console-errors">No errors detected yet...</div>
    </div>
    
    <div class="debug">
        <h3>Actions:</h3>
        <button onclick="setAuth()">Set Authentication</button>
        <button onclick="goToTopics()">Go to Topics</button>
        <button onclick="clearStorage()">Clear Storage</button>
    </div>
    
    <script>
        // Capture console errors
        const originalConsoleError = console.error;
        const errors = [];
        
        console.error = function(...args) {
            errors.push(args.join(' '));
            updateErrorDisplay();
            originalConsoleError.apply(console, arguments);
        };
        
        function updateErrorDisplay() {
            const errorDiv = document.getElementById('console-errors');
            if (errors.length > 0) {
                errorDiv.innerHTML = errors.map(err => `<div class="error">${err}</div>`).join('');
            }
        }
        
        function checkAuth() {
            const isAuth = localStorage.getItem('isAuthenticated');
            const user = localStorage.getItem('user');
            
            document.getElementById('auth-status').innerHTML = `
                <strong>isAuthenticated:</strong> ${isAuth}<br>
                <strong>user:</strong> ${user}
            `;
            
            if (isAuth === 'true') {
                document.getElementById('auth-status').className = 'success';
            } else {
                document.getElementById('auth-status').className = 'error';
            }
        }
        
        function setAuth() {
            localStorage.setItem('isAuthenticated', 'true');
            localStorage.setItem('user', JSON.stringify({
                id: 1,
                username: 'testuser',
                role: 'user'
            }));
            checkAuth();
            console.log('Authentication set successfully');
        }
        
        function goToTopics() {
            window.location.href = '/topics';
        }
        
        function clearStorage() {
            localStorage.clear();
            checkAuth();
        }
        
        // Initial check
        document.getElementById('current-url').textContent = window.location.href;
        checkAuth();
        
        // Check for Vue errors
        setTimeout(() => {
            if (window.Vue) {
                console.log('Vue is loaded');
            } else {
                console.error('Vue is not loaded');
            }
        }, 2000);
    </script>
</body>
</html>
