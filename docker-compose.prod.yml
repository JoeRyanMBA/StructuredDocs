version: '3.8'

services:
  app:
    build: .
    container_name: structureddocs_app
    environment:
      - PORT=8080
      # Override this in production via environment or .env if using an external DB
      - DATABASE_URL=${DATABASE_URL:-sqlite:///structured_docs.db}
      - ENABLE_BLUEPRINTS_FILE=.enable_blueprints
      # Email configuration (set these in your deployment environment)
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-sendgrid}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@structureddocs.online}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - FROM_NAME=${FROM_NAME:-StructuredDocs}
      - SENDGRID_VERIFIED_SENDER=${SENDGRID_VERIFIED_SENDER:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://structureddocs.online}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Persist SQLite DB on host (optional). Comment out if using Postgres.
    volumes:
      - ./instance:/app/instance
      # Persist imported images across restarts (served via /images)
      - ./data/images:/app/backend/static/images
    command: ["./start.sh"]
