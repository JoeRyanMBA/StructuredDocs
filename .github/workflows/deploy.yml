name: Deploy To VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-vps-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configure known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST secret is required}"
          PORT="${VPS_PORT:-22}"
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [[ -n "${VPS_HOST_KEY:-}" ]]; then
            printf '%s\n' "$VPS_HOST_KEY" >> ~/.ssh/known_hosts
          else
            if ! ssh-keyscan -T 10 -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "::warning::ssh-keyscan could not reach $VPS_HOST:$PORT – known_hosts will be empty. Set the VPS_HOST_KEY secret for strict host verification."
            fi
          fi

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          PORT="${VPS_PORT:-22}"
          SSH_OPTS=(
            -i ~/.ssh/id_ed25519
            -p "$PORT"
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )

          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" <<'EOF'
            set -euo pipefail
            mkdir -p /opt/structureddocs/app
            mkdir -p /opt/structureddocs/app/data/images
            mkdir -p /opt/structureddocs/app/instance
          EOF

          rsync -az --delete --omit-dir-times --no-perms \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude '.env' \
            --exclude 'instance/' \
            --exclude 'structured_docs.db' \
            --exclude 'data/' \
            --exclude 'data/images/' \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/structureddocs/app/"

          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" <<'EOF'
            set -euo pipefail
            cd /opt/structureddocs/app

            if [[ ! -f /opt/structureddocs/.env ]]; then
              echo "Missing /opt/structureddocs/.env on the server."
              exit 1
            fi

            if ! grep -Eq '^DATABASE_URL=.+$' /opt/structureddocs/.env; then
              echo "DATABASE_URL is missing or blank in /opt/structureddocs/.env."
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif sudo -n docker compose version >/dev/null 2>&1; then
              DC="sudo -n docker compose"
            else
              echo "Docker Compose requires either direct docker access or passwordless sudo for the deploy user."
              echo "Fix the server by adding the deploy user to the docker group or allowing passwordless sudo for docker compose."
              exit 1
            fi

            run_privileged() {
              if sudo -n true >/dev/null 2>&1; then
                sudo -n "$@"
              else
                "$@"
              fi
            }

            COMPOSE_FILE="docker-compose.yml"

            DOMAIN="${DOMAIN:-}"
            if [[ -z "$DOMAIN" ]]; then
              FRONTEND_URL="$(grep -E '^FRONTEND_URL=' /opt/structureddocs/.env | tail -n1 | cut -d= -f2-)"
              DOMAIN="$(FRONTEND_URL="$FRONTEND_URL" python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ["FRONTEND_URL"]).hostname or "")')"
            fi
            : "${DOMAIN:?DOMAIN is required; set DOMAIN in /opt/structureddocs/.env or provide a valid FRONTEND_URL.}"
            export DOMAIN

            # Stop and remove any stale container with the same name that may have been
            # created under a different Compose project (e.g. manual run or old deploy).
            docker rm -f structureddocs_app 2>/dev/null || true
            docker rm -f structureddocs-caddy-1 2>/dev/null || true

            # Stop common host-level web servers that may already own 80/443.
            run_privileged systemctl stop caddy 2>/dev/null || true
            run_privileged systemctl disable caddy 2>/dev/null || true
            run_privileged systemctl stop nginx 2>/dev/null || true
            run_privileged systemctl disable nginx 2>/dev/null || true
            run_privileged systemctl stop apache2 2>/dev/null || true
            run_privileged systemctl disable apache2 2>/dev/null || true

            # Remove any docker containers publishing 80 or 443.
            for cid in $(docker ps -q); do
              ports="$(docker inspect --format '{{range $p, $conf := .NetworkSettings.Ports}}{{$p}} {{end}}' "$cid" 2>/dev/null || true)"
              if echo "$ports" | grep -Eq '(^| )(80/tcp|443/tcp|443/udp)( |$)'; then
                docker rm -f "$cid" || true
              fi
            done

            # Fail early with a useful message if ports are still busy.
            if command -v ss >/dev/null 2>&1; then
              if ss -ltn '( sport = :80 or sport = :443 )' | grep -Eq ':80|:443'; then
                echo "Ports 80/443 are still in use on the host. Free them before starting Caddy."
                ss -ltnp '( sport = :80 or sport = :443 )' || true
                exit 1
              fi
            fi

            $DC -p structureddocs --env-file /opt/structureddocs/.env -f "$COMPOSE_FILE" up -d --build --remove-orphans
            $DC -p structureddocs --env-file /opt/structureddocs/.env -f "$COMPOSE_FILE" ps

            app_container_id() {
              # Prefer label lookup because it is stable regardless of generated container names.
              docker ps -aq \
                --filter "label=com.docker.compose.project=structureddocs" \
                --filter "label=com.docker.compose.service=app" \
                | head -n1
            }

            # ── Step 1: wait for the app container itself to become running/healthy ──
            ok=0
            for i in $(seq 1 36); do
              app_cid="$(app_container_id || true)"
              if [[ -z "$app_cid" ]]; then
                app_cid="$($DC -p structureddocs --env-file /opt/structureddocs/.env -f "$COMPOSE_FILE" ps -q app 2>/dev/null || true)"
              fi
              if [[ -n "$app_cid" ]]; then
                app_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$app_cid" 2>/dev/null || echo missing)"
              else
                app_status="missing"
              fi
              if [[ "$app_status" == "healthy" || "$app_status" == "running" ]]; then
                ok=1
                break
              fi
              echo "App container status attempt $i/36: $app_status; retrying in 5s..."
              sleep 5
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "App container did not become healthy/running after retries. Recent app logs:"
              $DC -p structureddocs --env-file /opt/structureddocs/.env -f "$COMPOSE_FILE" logs --tail 120
              exit 1
            fi

            # ── Step 2: wait for gunicorn to actually respond (migrations may delay this) ──
            # Check directly inside the container to bypass Caddy/TLS entirely.
            ok=0
            for i in $(seq 1 36); do
              app_cid="$(app_container_id || true)"
              if [[ -z "$app_cid" ]]; then
                app_cid="$($DC -p structureddocs --env-file /opt/structureddocs/.env -f "$COMPOSE_FILE" ps -q app 2>/dev/null || true)"
              fi
              if [[ -n "$app_cid" ]] && docker exec "$app_cid" curl -fsSL http://localhost:8080/api/health > /dev/null 2>&1; then
                ok=1
                break
              fi
              echo "App HTTP healthcheck attempt $i/36 failed; retrying in 5s..."
              sleep 5
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "App did not respond on port 8080 after retries. Recent app logs:"
              $DC -p structureddocs --env-file /opt/structureddocs/.env -f "$COMPOSE_FILE" logs --tail 120
              exit 1
            fi
            echo "✅ App is responding on port 8080."

            # ── Step 3: verify HTTPS through Caddy (cert may still be acquiring on first deploy) ──
            ok=0
            for i in $(seq 1 24); do
              if curl -kfsSL --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/api/health" > /dev/null; then
                ok=1
                break
              fi
              echo "HTTPS healthcheck attempt $i/24 failed; retrying in 5s..."
              sleep 5
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "⚠️  HTTPS healthcheck via Caddy did not pass within the timeout."
              echo "    The app itself is healthy (Step 2 passed). Caddy may still be acquiring a TLS certificate."
              echo "    Deployment is considered successful. Check Caddy logs if HTTPS remains unavailable:"
              $DC -p structureddocs --env-file /opt/structureddocs/.env -f "$COMPOSE_FILE" logs caddy --tail 40
            else
              echo "✅ HTTPS healthcheck passed."
            fi
          EOF
