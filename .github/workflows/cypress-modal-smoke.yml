name: Cypress Modal Smoke

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - 'cypress/**'
      - '.github/workflows/cypress-modal-smoke.yml'
      - 'cypress.config.js'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - 'cypress/**'
      - '.github/workflows/cypress-modal-smoke.yml'
      - 'cypress.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  modal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run Cypress modal smoke spec
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          command: npm run cy:modal-smoke
          start: npm --prefix frontend run dev -- --host 0.0.0.0 --port 5173
          wait-on: 'http://127.0.0.1:5173'
          wait-on-timeout: 120

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-modal-smoke-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
