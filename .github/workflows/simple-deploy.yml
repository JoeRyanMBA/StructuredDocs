name: Simple Deploy to PythonAnywhere

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  notify-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🔔 Trigger PythonAnywhere Reload
      env:
        API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
      run: |
        # Simple webhook to reload web app (only if API token is available)
        if [ -n "$API_TOKEN" ]; then
          curl -X POST \
            -H "Authorization: Token $API_TOKEN" \
            https://www.pythonanywhere.com/api/v0/user/JoeRyanMBA/webapps/joeryanmba.pythonanywhere.com/reload/
          echo "✅ Deployment notification sent to PythonAnywhere"
        else
          echo "⚠️  PYTHONANYWHERE_API_TOKEN not configured - skipping reload notification"
        fi
    
    - name: 📝 Deployment Notes
      run: |
        echo "ℹ️  You may need to manually pull changes on PythonAnywhere console"
        echo "ℹ️  To enable automatic reloads, add PYTHONANYWHERE_API_TOKEN to repository secrets"
