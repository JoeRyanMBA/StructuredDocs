name: Backend CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version metadata
        id: meta
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_time=$TS" >> $GITHUB_OUTPUT
          echo "app_version=0.2.0" >> $GITHUB_OUTPUT
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/structured-docs-backend:latest
            ghcr.io/${{ github.repository_owner }}/structured-docs-backend:${{ steps.meta.outputs.commit }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
  
  deploy-ssh:
    needs: build-and-publish
    if: ${{ success() && secrets.PROD_HOST }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (pull & restart)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd $HOME/StructuredDocs
            git pull origin main
            docker compose -f docker-compose.app.yml build --pull backend
            docker compose -f docker-compose.app.yml up -d --force-recreate backend
            docker image prune -f || true
